name: Publish hourly public status

on:
  schedule:
    # Deliberately avoid the top of the hour, when GitHub Actions is busiest.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-status
  cancel-in-progress: false

jobs:
  observe:
    name: Observe public platform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STATUS_OBSERVATION_ID: ${{ github.run_id }}
      PORTFOLIO_URL: https://francesco.belacca.com
      PONG_URL: https://pong.belacca.com
      ANALYTICS_URL: https://stats.belacca.com
      PONG_CHECKOUT_PATH: ${{ github.workspace }}/cloudnativepong-checkout
    steps:
      - name: Check out status repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out Pong synthetic runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: macel94/cloudnativepong
          ref: main
          path: cloudnativepong-checkout
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Install Pong synthetic dependency
        working-directory: ${{ github.workspace }}/cloudnativepong-checkout
        run: npm ci --ignore-scripts

      - name: Validate status monitor
        run: npm test

      - name: Generate and commit status observation
        id: publish
        shell: bash
        run: |
          set +e
          export PONG_COMMIT="$(git -C "$PONG_CHECKOUT_PATH" rev-parse HEAD)"
          node scripts/monitor.mjs \
            --pong-script "$PONG_CHECKOUT_PATH/scripts/synthetic-check.mjs" \
            --output status.json \
            --history-dir history
          monitor_status=$?
          node scripts/validate-status.mjs status.json
          validation_status=$?

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.json history
          if git diff --cached --quiet; then
            echo 'No status changes to commit.'
          else
            git commit -m "status: publish observation ${STATUS_OBSERVATION_ID}"
            git push
          fi
          if [[ "$monitor_status" -ne 0 ]]; then exit "$monitor_status"; fi
          exit "$validation_status"
